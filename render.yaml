services:
  # Backend - Flask API
  - type: web
    name: timetotask-backend
    runtime: python
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: FRONTEND_URL
        fromService:
          name: timetotask-frontend
          type: web
          property: url
      - key: DATABASE_URL
        fromDatabase:
          name: timetotask-db
          property: connectionString

  # Frontend - React Static Site
  - type: web
    name: timetotask-frontend
    runtime: static
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://timetotask-backend.onrender.com/api
      - key: VITE_NODE_ENV
        value: production

databases:
  - name: timetotask-db
    plan: free
    region: frankfurt
